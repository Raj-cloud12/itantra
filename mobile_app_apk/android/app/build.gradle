// iTantra Android Native Node Application
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    // Allow ONNX models to be compressed inside APK (saves ~20-30 MB)
    // Sherpa ONNX handles decompression automatically on first load
    androidResources {
        // noCompress removed to allow APK compression of models
    }

    namespace 'com.ititantra.civilianapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.ititantra.civilianapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Only bundle ARM architectures (real phones)
        // Drops x86/x86_64 emulator-only libs (~72 MB savings)
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
}

task downloadWhisperModels {
    doLast {
        def targetDir = file("src/main/assets/whisper-tiny")
        targetDir.mkdirs()
        def files = [
            "tiny-tokens.txt": "https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-tokens.txt",
            "tiny-encoder.int8.onnx": "https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-encoder.int8.onnx",
            "tiny-decoder.int8.onnx": "https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main/tiny-decoder.int8.onnx"
        ]
        files.each { name, url ->
            def f = file("${targetDir}/${name}")
            if (!f.exists() || f.length() < 1000) {
                println "Downloading Sherpa-ONNX model: ${name}..."
                ant.get(src: url, dest: f)
            }
        }
    }
}
preBuild.dependsOn downloadWhisperModels
